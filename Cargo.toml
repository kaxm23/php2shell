[package]
name = "php2shell"
version = "0.4.0"
edition = "2021"

[dependencies]
clap          = { version = "4", features = ["derive"] }
reqwest       = { version = "0.11", default-features = false,
                  features = ["blocking", "native-tls", "json", "socks"] }
native-tls    = "0.2"
rand          = "0.8"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
url           = "2"
urlencoding   = "2"